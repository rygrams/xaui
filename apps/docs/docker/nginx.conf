server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The markdown and text files are read by agents; `charset` only applies to the types
    # listed here, and nginx's stock map has no entry for `.md`.
    charset utf-8;
    charset_types text/plain text/markdown text/xml application/xml;

    # The export's `/` is a client-side redirect: an empty page to a crawler. Send it on
    # with a real 301 instead.
    location = / {
        return 301 /docs/introduction;
    }

    location ~* \.md$ {
        default_type text/markdown;
        try_files $uri =404;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|css|js)$ {
        try_files $uri =404;
    }

    location / {
        rewrite ^/(.*)/$ /$1 permanent;
        try_files $uri $uri.html $uri/index.html =404;
    }
}
