server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # TLS ends at the Dokploy proxy, so nginx only ever sees plain HTTP. An absolute
    # redirect would point at `http://…` and the browser blocks it as mixed content;
    # a relative `Location` keeps the visitor on HTTPS.
    absolute_redirect off;

    # The markdown and text files are read by agents; `charset` only applies to the types
    # listed here, and nginx's stock map has no entry for `.md`.
    charset utf-8;
    charset_types text/plain text/markdown text/xml application/xml;

    # The proxy does not compress, so nginx does. `text/html` is always on the list;
    # `text/plain` covers the RSC payloads Next prefetches on every link.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/markdown text/xml application/xml
        application/javascript application/json image/svg+xml;

    # The export's `/` is a client-side redirect: an empty page to a crawler. Send it on
    # with a real 301 instead.
    location = / {
        return 301 /docs/introduction;
    }

    # Next hashes every file under `/_next/static/` into its name, so a file there never
    # changes: cache it for a year. `^~` keeps the asset regex below from taking it.
    location ^~ /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.md$ {
        default_type text/markdown;
        try_files $uri =404;
    }

    # `public/` files keep their names across deploys, so they get a day, not a year.
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|css|js)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Pages revalidate on every visit (the ETag makes that a 304) so a deploy shows at once.
    location / {
        add_header Cache-Control "no-cache";
        rewrite ^/(.*)/$ /$1 permanent;
        try_files $uri $uri.html $uri/index.html =404;
    }
}
