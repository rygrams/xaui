appId: com.anonymous.demo
name: s13-color-live
---
# Standalone, the flow opens its screen. make.sh opens it before recording and
# passes SKIP_OPEN=1, so the clip starts on a settled screen. (A flow-level `env`
# default would win over `-e`, hence the typeof test.)
- runFlow:
    when:
      true: ${typeof SKIP_OPEN === 'undefined'}
    file: _open.yaml
    env:
      LINK: demo://demo/button?scene=colors-picker
- extendedWaitUntil:
    visible:
      id: "__hold__"
    timeout: 600
    optional: true
- tapOn:
    id: tint-violet
- waitForAnimationToEnd
- tapOn:
    id: tint-emerald
- waitForAnimationToEnd
- tapOn:
    id: tint-orange
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "__hold__"
    timeout: 2940
    optional: true
