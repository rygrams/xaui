appId: com.anonymous.demo
name: open a scene
---
# Cold start into the scene: no navigation stack, no leftover state from a previous take.
- stopApp
- openLink: ${LINK}
# iOS may ask to confirm a custom scheme the first time.
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: scene-ready
    timeout: 20000
- waitForAnimationToEnd
